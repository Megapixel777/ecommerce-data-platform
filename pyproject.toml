[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "End-to-end e-commerce data engineering platform built with PySpark, Databricks and Delta Lake."
requires-python = ">=3.12,<3.13"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]